<!doctype html>
<html lang="lv">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Jira mācību vide · 2. modulis</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:ital,wght@0,400;0,500;0,600;0,700;1,400&family=IBM+Plex+Mono:wght@400;500&family=Manrope:wght@700;800&display=swap">
<style>
/* Mācību smilškaste, kas atdarina Jira Software Data Center: projekti, dēļi, backlog, meklēšana,
   filtri, dashboard, Plans un Programs. Augšā demo josla (persona, paziņojumi, scenārijs, atiestatīšana).
   Viena gaiša tēma, jo tā atdarina Jira DC noklusējuma izskatu. */
:root{
  color-scheme:light;
  --bg:#F4F5F7; --surface:#FFFFFF; --ink:#172B4D; --muted:#5E6C84; --line:#DFE1E6; --line2:#EBECF0;
  --blue:#0C66E4; --blue-d:#0747A6; --blue-soft:#E9F2FF;
  --green:#216E4E; --green-soft:#DCFFF1; --amber:#7F5F01; --amber-soft:#FFF7D6; --amber-line:#E2B203;
  --red:#AE2E24; --red-soft:#FFECEB; --purple:#5E4DB2; --purple-soft:#F3F0FF;
  --claret:#8C1D2F; --demo:#1A1D24;
  --f:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --fm:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
  --fd:"Manrope","IBM Plex Sans",system-ui,sans-serif;
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.45 var(--f)}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--blue);outline-offset:2px}
a{color:var(--blue);text-decoration:none;cursor:pointer}
a:hover{text-decoration:underline}
.mono{font-family:var(--fm)}
.muted{color:var(--muted)}
.hidden{display:none!important}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.sp{flex:1}

/* Demo josla */
#demobar{position:sticky;top:0;z-index:60;background:var(--demo);color:#E9EAEE;display:flex;align-items:center;gap:12px;flex-wrap:wrap;padding:8px 16px;padding-top:calc(8px + env(safe-area-inset-top,0px))}
#demobar .badge{font:800 11px/1 var(--fd);letter-spacing:.14em;text-transform:uppercase;background:#E8788A;color:#1A1D24;padding:5px 8px;border-radius:4px}
#demobar .ttl{font-weight:600;white-space:nowrap}
.seg{display:inline-flex;background:#2C303A;border-radius:8px;padding:3px;flex-wrap:wrap}
.seg button{border:0;background:transparent;color:#C9CCD4;padding:6px 10px;border-radius:6px;font-weight:600;font-size:13px;min-height:32px}
.seg button[aria-pressed="true"]{background:#F4F5F7;color:#1A1D24}
.dbtn{border:1px solid #444A57;background:#232730;color:#E9EAEE;border-radius:6px;padding:6px 12px;font-size:13px;font-weight:600;min-height:32px;display:inline-flex;align-items:center;gap:6px}
.dbtn:hover{border-color:#8A90A0}
.dbtn .cnt{background:#E8788A;color:#1A1D24;border-radius:999px;padding:0 6px;font-size:11px;font-weight:700}

/* Jira galvene */
.jnav{background:var(--blue-d);color:#fff;display:flex;align-items:center;gap:4px;padding:0 12px;min-height:48px;flex-wrap:wrap;position:relative;z-index:30}
.jnav .logo{font:800 17px/1 var(--fd);display:flex;align-items:center;gap:8px;padding:0 10px 0 2px;color:#fff;white-space:nowrap}
.jnav .logo i{width:22px;height:22px;border-radius:4px;background:#fff;display:inline-grid;place-items:center;color:var(--blue-d);font-style:normal;font-size:13px}
.jnav .mi{position:relative}
.jnav .mi>button{background:transparent;border:0;color:#fff;font-weight:500;padding:12px 10px;border-radius:3px}
.jnav .mi>button:hover,.jnav .mi>button[aria-expanded="true"]{background:#ffffff26}
.jnav .create{background:#fff;color:var(--blue-d);border:0;border-radius:3px;padding:6px 12px;font-weight:600;margin-left:6px}
.jnav .create:hover{background:#DEEBFF}
.jnav input[type=search]{width:200px;max-width:40vw;background:#ffffff26;border:0;color:#fff;border-radius:3px;padding:6px 10px;min-height:32px}
.jnav input[type=search]::placeholder{color:#E6EEFF}
.jnav input[type=search]:focus{background:#fff;color:var(--ink);outline:none}
.av{width:28px;height:28px;border-radius:50%;display:inline-grid;place-items:center;font-size:11px;font-weight:700;color:#fff;flex:none}
.av.sm{width:22px;height:22px;font-size:9px}
.av.none{background:#DFE1E6;color:#5E6C84}
.menu{position:absolute;top:100%;left:0;min-width:260px;background:#fff;color:var(--ink);border-radius:4px;box-shadow:0 8px 24px rgb(9 30 66 / .25);padding:6px 0;z-index:70}
.menu .h{font-size:11px;font-weight:700;text-transform:uppercase;color:var(--muted);padding:8px 14px 4px;letter-spacing:.04em}
.menu a,.menu button.mitem{display:flex;gap:8px;align-items:center;width:100%;text-align:left;background:none;border:0;padding:8px 14px;color:var(--ink);text-decoration:none}
.menu a:hover,.menu button.mitem:hover{background:var(--blue-soft)}
.menu hr{border:0;border-top:1px solid var(--line);margin:6px 0}

/* Izkārtojums */
#main{display:flex;min-height:calc(100vh - 100px)}
#app{flex:1;min-width:0}
#drawer{width:380px;flex:none;background:var(--surface);border-left:1px solid var(--line);overflow-y:auto;max-height:calc(100vh - 52px);position:sticky;top:52px}
@media (max-width:900px){#drawer{position:fixed;inset:52px 0 0 auto;width:min(380px,92vw);z-index:65;box-shadow:-8px 0 24px rgb(9 30 66 / .18)}}
.page{padding:20px 24px 48px;max-width:1400px}
@media (max-width:640px){.page{padding:16px}}
.crumbs{font-size:13px;color:var(--muted);margin-bottom:6px}
h1.pt{font:600 24px/1.25 var(--f);margin:0 0 16px}
h2.st{font:600 16px/1.3 var(--f);margin:20px 0 10px}
.shell{display:flex;min-height:calc(100vh - 100px)}
.side{width:232px;flex:none;background:#FAFBFC;border-right:1px solid var(--line);padding:16px 8px}
.side .pj{display:flex;gap:10px;align-items:center;padding:4px 8px 16px}
.side .pj b{display:block;font-size:14px;line-height:1.2}
.side .pj small{color:var(--muted);font-size:12px}
.side a{display:flex;gap:10px;align-items:center;padding:8px 10px;border-radius:3px;color:var(--ink);text-decoration:none}
.side a:hover{background:#EBECF0}
.side a[aria-current="page"]{background:var(--blue-soft);color:var(--blue)}
.pico{width:32px;height:32px;border-radius:4px;display:grid;place-items:center;color:#fff;font:800 13px/1 var(--fd);flex:none}
@media (max-width:760px){.shell{flex-direction:column}.side{width:auto;border-right:0;border-bottom:1px solid var(--line);display:flex;flex-wrap:wrap;gap:2px;padding:8px}.side .pj{width:100%;padding-bottom:6px}}

/* Pogas un lauki */
.btn{border:0;border-radius:3px;padding:6px 12px;font-weight:500;background:#091E420F;color:var(--ink);min-height:32px;display:inline-flex;align-items:center;gap:6px;white-space:nowrap}
.btn:hover{background:#091E4224}
.btn.primary{background:var(--blue);color:#fff}
.btn.primary:hover{background:var(--blue-d)}
.btn.subtle{background:transparent}
.btn.subtle:hover{background:#091E420F}
.btn.sm{padding:3px 8px;min-height:26px;font-size:13px}
.btn[disabled]{opacity:.5;cursor:not-allowed}
.btn.on{background:var(--blue-soft);color:var(--blue)}
input[type=text],input[type=search],input[type=date],input[type=number],select,textarea{border:2px solid var(--line);background:#FAFBFC;border-radius:3px;padding:6px 8px;width:100%;min-height:36px}
input:focus,select:focus,textarea:focus{border-color:var(--blue);background:#fff;outline:none}
textarea{min-height:96px;resize:vertical}
label.f{display:block;font-weight:600;font-size:12px;color:var(--muted);margin:0 0 4px}
label.f .req{color:var(--red)}
.field{display:flex;flex-direction:column;gap:2px;margin-bottom:14px}
.err{color:var(--red);font-size:12px}
.field.has-err input,.field.has-err select{border-color:var(--red);background:var(--red-soft)}
.help{font-size:12px;color:var(--muted)}
.card{background:var(--surface);border:1px solid var(--line);border-radius:4px}

/* Statusi un ikonas */
.lz{display:inline-block;font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.02em;padding:2px 6px;border-radius:3px;background:#DFE1E6;color:#42526E;white-space:nowrap}
.lz.ip{background:var(--blue-soft);color:#0055CC}
.lz.done{background:#DCFFF1;color:var(--green)}
.ti{width:16px;height:16px;border-radius:3px;display:inline-grid;place-items:center;flex:none;vertical-align:-3px}
.ti svg{width:10px;height:10px}
.pr{font-size:12px;font-weight:700;width:16px;display:inline-block;text-align:center}
.tag{display:inline-block;font-size:12px;background:#EBECF0;border-radius:3px;padding:1px 6px;margin:0 4px 4px 0}
.overdue{color:var(--red);font-weight:600}

/* Tabulas */
table.t{border-collapse:collapse;width:100%;background:#fff}
table.t th{text-align:left;font-size:12px;color:var(--muted);font-weight:600;border-bottom:2px solid var(--line);padding:8px 10px;white-space:nowrap}
table.t td{border-bottom:1px solid var(--line2);padding:8px 10px;vertical-align:middle}
table.t tr:hover td{background:#FAFBFC}
.tw{overflow-x:auto;border:1px solid var(--line);border-radius:4px;background:#fff}

/* Dēlis */
.bhead{display:flex;gap:12px;align-items:center;flex-wrap:wrap;margin-bottom:12px}
.qf{display:flex;gap:6px;flex-wrap:wrap;align-items:center;margin-bottom:14px}
.cols{display:grid;grid-auto-flow:column;grid-auto-columns:minmax(240px,1fr);gap:10px;overflow-x:auto;padding-bottom:8px}
.col{background:#F4F5F7;border:1px solid var(--line2);border-radius:4px;min-height:360px;display:flex;flex-direction:column}
.col h3{font-size:12px;text-transform:uppercase;color:var(--muted);margin:0;padding:10px 12px;display:flex;gap:6px;align-items:center;letter-spacing:.03em}
.col h3 .wip{margin-left:auto;font-weight:600}
.col.over{background:#FFECEB;border-color:#F87168}
.col.over h3 .wip{color:var(--red)}
.col .drop{flex:1;padding:0 8px 8px;display:flex;flex-direction:column;gap:6px}
.col.dragover{outline:2px dashed var(--blue);outline-offset:-4px}
.bcard{background:#fff;border-radius:3px;box-shadow:0 1px 1px rgb(9 30 66 / .25);padding:10px;cursor:grab;display:flex;flex-direction:column;gap:8px;border-left:3px solid transparent}
.bcard:hover{background:#FAFBFC}
.bcard.od{border-left-color:var(--red)}
.bcard .bot .mono{white-space:nowrap}
.bcard .bot{display:flex;gap:6px;align-items:center;font-size:12px;color:var(--muted)}

/* Backlog */
.sprint{background:#fff;border:1px solid var(--line);border-radius:4px;margin-bottom:14px}
.sprint .sh{display:flex;gap:10px;align-items:center;flex-wrap:wrap;padding:10px 12px;border-bottom:1px solid var(--line2);background:#FAFBFC}
.irow{display:flex;gap:8px;align-items:center;padding:7px 12px;border-bottom:1px solid var(--line2);flex-wrap:wrap}
.irow:last-child{border-bottom:0}
.irow .s{flex:1;min-width:180px}
.irow select{width:auto;min-height:28px;padding:2px 6px;font-size:12px}

/* Pieteikuma skats */
.iv{display:grid;grid-template-columns:minmax(0,1fr) 320px;gap:28px}
@media (max-width:980px){.iv{grid-template-columns:minmax(0,1fr)}}
@media (max-width:640px){dl.det{grid-template-columns:110px minmax(0,1fr)!important}}
.iv h1{font:600 22px/1.3 var(--f);margin:4px 0 12px}
.ops{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:16px}
.mod{margin-bottom:22px}
.mod>h4{font-size:13px;font-weight:700;margin:0 0 8px;color:var(--ink);border-bottom:1px solid var(--line);padding-bottom:4px}
dl.det{display:grid;grid-template-columns:120px 1fr;gap:8px 12px;margin:0}
dl.det dt{color:var(--muted)}
dl.det dd{margin:0;min-width:0}
.desc{white-space:pre-wrap;background:#fff;border:1px solid transparent;border-radius:3px;padding:6px}
.desc:hover{border-color:var(--line)}
.tabs{display:flex;gap:2px;border-bottom:2px solid var(--line);margin-bottom:12px;flex-wrap:wrap}
.tabs button{background:none;border:0;padding:8px 12px;color:var(--muted);font-weight:600;border-bottom:2px solid transparent;margin-bottom:-2px}
.tabs button[aria-selected="true"]{color:var(--blue);border-bottom-color:var(--blue)}
.cmt{display:flex;gap:10px;padding:10px 0;border-bottom:1px solid var(--line2)}
.cmt .b{flex:1;min-width:0}
.cmt .who{font-size:13px}
.cmt .txt{white-space:pre-wrap;margin-top:4px}
.mention{background:var(--blue-soft);color:var(--blue);border-radius:3px;padding:0 3px;font-weight:600}
.att{display:inline-flex;gap:8px;align-items:center;border:1px solid var(--line);border-radius:4px;padding:8px 10px;margin:0 8px 8px 0;background:#fff;font-size:13px}
.hist td{font-size:13px}
.suggest{border:1px solid var(--line);border-radius:4px;background:#fff;box-shadow:0 4px 12px rgb(9 30 66 / .15);margin-top:4px;max-width:320px}
.suggest button{display:flex;gap:8px;align-items:center;width:100%;text-align:left;border:0;background:none;padding:6px 10px}
.suggest button:hover{background:var(--blue-soft)}

/* Meklēšana */
.sbar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:12px}
.sbar select{width:auto;min-width:130px}
.jql{font-family:var(--fm);font-size:13px;min-height:40px}
.sres{display:grid;grid-template-columns:220px minmax(0,1fr);gap:16px}
@media (max-width:860px){.sres{grid-template-columns:minmax(0,1fr)}}
.flist a{display:block;padding:6px 8px;border-radius:3px;color:var(--ink);text-decoration:none}
.flist a:hover{background:#EBECF0}
.flist a[aria-current="page"]{background:var(--blue-soft);color:var(--blue)}
.flist .h{font-size:11px;font-weight:700;text-transform:uppercase;color:var(--muted);margin:14px 8px 4px}

/* Dashboard */
.dgrid{display:grid;gap:14px}
@media (max-width:760px){.dgrid{grid-template-columns:1fr!important}}
.gad{background:#fff;border:1px solid var(--line);border-radius:4px;min-width:0}
.gad .gh{display:flex;gap:8px;align-items:center;padding:8px 12px;border-bottom:1px solid var(--line2);background:#FAFBFC}
.gad .gh b{flex:1;font-size:14px}
.gad .gb{padding:12px;overflow-x:auto}
.cat{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:10px}
.cat .card{padding:12px;display:flex;flex-direction:column;gap:8px}
.legend{display:flex;flex-direction:column;gap:4px;font-size:13px}
.legend i{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:6px}

/* Plāns */
.ptool{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:12px}
.plan{overflow:auto;border:1px solid var(--line);border-radius:4px;background:#fff;max-height:calc(100vh - 260px);position:relative}
.prow{display:flex;height:40px;border-bottom:1px solid var(--line2)}
.prow.hd{position:sticky;top:0;z-index:5;background:#FAFBFC;height:44px;font-size:12px;color:var(--muted);font-weight:600}
.pl{position:sticky;left:0;z-index:3;background:inherit;display:flex;flex:none;border-right:2px solid var(--line)}
.prow{background:#fff}
.prow.hd .pl{background:#FAFBFC;z-index:6}
.pc{padding:0 8px;display:flex;align-items:center;gap:6px;border-right:1px solid var(--line2);overflow:hidden;white-space:nowrap;flex:none}
.pc.scope{width:340px}
.pc.w1{width:150px}.pc.w2{width:110px}.pc.w3{width:120px}
.pc select,.pc input{min-height:28px;padding:2px 4px;font-size:12px;border-width:1px}
.pc.chg{background:#FFF7D6;box-shadow:inset 3px 0 0 var(--amber-line)}
.tl{position:relative;flex:none}
.tl .wk{position:absolute;top:0;bottom:0;border-left:1px solid var(--line2)}
.tl .wkl{position:absolute;top:4px;font-size:11px;color:var(--muted);white-space:nowrap}
.tl .mol{position:absolute;top:22px;font-size:11px;font-weight:700;color:var(--ink);white-space:nowrap}
.today{position:absolute;top:0;bottom:0;width:2px;background:#E8788A;z-index:2;pointer-events:none}
.bar{position:absolute;top:9px;height:22px;border-radius:4px;background:#8FB8F6;cursor:grab;display:flex;align-items:center;touch-action:none;font-size:11px;color:#09326C;padding:0 8px;white-space:nowrap;overflow:visible}
.bar.epic{background:#B8ACF6;color:#352C63}
.bar.done{background:#7EE2B8;color:#164B35}
.bar.chg{outline:2px solid var(--amber-line)}
.bar .rz{position:absolute;right:-2px;top:0;bottom:0;width:10px;cursor:ew-resize}
.bar .rzl{position:absolute;left:-2px;top:0;bottom:0;width:10px;cursor:ew-resize}
.warn{color:#B65C02;font-weight:700}
.wbadge{background:#FFF7D6;color:#7F5F01;border:1px solid var(--amber-line)}
.pbar{height:8px;background:#EBECF0;border-radius:4px;overflow:hidden;display:flex}
.pbar i{display:block;height:100%}
.depsvg{position:absolute;left:0;top:0;pointer-events:none;z-index:2}

/* Logi */
.ov{position:fixed;inset:0;background:rgb(9 30 66 / .54);z-index:80;display:flex;align-items:flex-start;justify-content:center;padding:6vh 16px;overflow-y:auto}
.dlg{background:#fff;border-radius:4px;width:min(640px,100%);box-shadow:0 12px 40px rgb(9 30 66 / .3)}
.dlg.wide{width:min(900px,100%)}
.dlg header{padding:16px 20px 8px;display:flex;align-items:center;gap:8px}
.dlg header h2{font:600 20px/1.3 var(--f);margin:0;flex:1}
.dlg .bd{padding:8px 20px 4px;max-height:66vh;overflow-y:auto}
.dlg footer{padding:12px 20px 16px;display:flex;gap:8px;justify-content:flex-end;align-items:center;flex-wrap:wrap;border-top:1px solid var(--line2)}
.steps{display:flex;gap:6px;margin-bottom:14px;flex-wrap:wrap}
.steps span{font-size:12px;padding:3px 8px;border-radius:999px;background:#EBECF0;color:var(--muted)}
.steps span.on{background:var(--blue);color:#fff}
.flag{position:fixed;left:16px;bottom:16px;z-index:90;background:#fff;border-left:4px solid var(--green);box-shadow:0 8px 24px rgb(9 30 66 / .25);border-radius:4px;padding:12px 16px;max-width:min(420px,calc(100vw - 32px))}
.flag.warnf{border-left-color:var(--amber-line)}

/* Drawer */
#drawer .dh{display:flex;align-items:center;gap:8px;padding:14px 16px;border-bottom:1px solid var(--line);position:sticky;top:0;background:#fff}
#drawer .dh b{flex:1;font:800 15px/1.2 var(--fd)}
.note{border-bottom:1px solid var(--line2);padding:12px 16px;font-size:13px}
.note .to{font-weight:600}
.scn h3{font:800 13px/1.3 var(--fd);margin:16px 16px 6px;color:var(--claret);text-transform:uppercase;letter-spacing:.06em}
.scn ol{margin:0;padding:0 16px 0 36px;font-size:13px}
.scn li{margin-bottom:6px}
.empty{padding:40px 16px;text-align:center;color:var(--muted)}
</style>
</head>
<body>
<div id="demobar">
  <span class="badge">Demo</span>
  <span class="ttl">Jira Software DC · mācību vide</span>
  <span class="sp"></span>
  <span style="font-size:12px;color:#9AA0AE">Persona:</span>
  <div class="seg" id="personas" role="group" aria-label="Persona"></div>
  <button class="dbtn" data-act="drawer" data-v="notif">Paziņojumi <span class="cnt" id="ncnt">0</span></button>
  <button class="dbtn" data-act="drawer" data-v="scn">Scenārijs</button>
  <button class="dbtn" data-act="reset">Atiestatīt datus</button>
</div>
<nav class="jnav" id="jnav" aria-label="Jira"></nav>
<div id="main">
  <div id="app"></div>
  <aside id="drawer" class="hidden" aria-label="Demo panelis"></aside>
</div>
<div id="modal"></div>
<div id="flagbox"></div>

<script>
"use strict";
const KEY='jira-dc-demo-m2-v1';
const TODAY='2026-10-19';
const USERS={
  anna:{name:'Anna Bērziņa',role:'Projekta vadītāja · Plan administratore',ini:'AB',color:'#8C1D2F',planAdmin:true},
  edgars:{name:'Edgars Krūmiņš',role:'Izstrādātājs',ini:'EK',color:'#0C66E4',planAdmin:false},
  laura:{name:'Laura Jansone',role:'Komunikācijas speciāliste',ini:'LJ',color:'#216E4E',planAdmin:false},
  maris:{name:'Māris Kalniņš',role:'IKT speciālists',ini:'MK',color:'#5E4DB2',planAdmin:false}
};
const PERSONAS=['anna','edgars','laura'];
const STATUSES=['To Do','In Progress','In Review','Done'];

/* ---------- JQL ---------- */
function tokenize(q){
  const re=/\s*("(?:[^"\\]|\\.)*"|'[^']*'|!=|>=|<=|!~|[=<>~(),]|[\p{L}0-9_.\-]+(?:\(\))?)/gu;const out=[];let m;
  while((m=re.exec(q))){if(!m[1])break;out.push(m[1])}
  return out;
}
function jqlVal(field,v){
  if(v==null)return v;
  let s=v.replace(/^["']|["']$/g,'');
  const l=s.toLowerCase();
  if(l==='currentuser()')return me();
  if(l==='now()'||l==='startofday()')return TODAY;
  if(l==='endofweek()')return addD(TODAY,6);
  if(l==='startofweek()')return addD(TODAY,0);
  if(/^-?\d+[dw]$/.test(l)){const n=parseInt(l)*(l.endsWith('w')?7:1);return addD(TODAY,n)}
  if(/^\d{4}-\d{2}-\d{2}$/.test(s))return s;
  if(['assignee','reporter'].includes(field)){const u=Object.keys(USERS).find(k=>k===l||USERS[k].name.toLowerCase()===l||USERS[k].name.toLowerCase().split(' ')[0]===l);return u||s}
  return s;
}
const FIELDMAP={type:'type',issuetype:'type',project:'project',status:'status',statuscategory:'cat',assignee:'assignee',reporter:'reporter',priority:'priority',duedate:'due',due:'due',created:'created',updated:'updated',resolution:'resolution',labels:'labels',sprint:'sprint',text:'text',summary:'text','"epic link"':'epic',epic:'epic',parent:'parent',key:'key',issuekey:'key'};
function fieldVal(i,f){
  switch(f){case 'project':return projOf(i);case 'cat':return {todo:'To Do',ip:'In Progress',done:'Done'}[CAT[i.status]];
    case 'resolution':return i.resolution||'Unresolved';case 'text':return i.summary+' '+i.desc;
    case 'sprint':return i.sprint;default:return i[f]}
}
function parseJQL(q){
  const t=tokenize(q);let p=0;const groups=[[]];let order=null;
  const peek=()=>t[p],next=()=>t[p++];
  while(p<t.length){
    const w=peek();
    if(/^order$/i.test(w)){next();if(!/^by$/i.test(next()||''))throw 'Gaidīts "ORDER BY"';order=[];
      while(p<t.length){const f=next();let dir='ASC';if(/^(asc|desc)$/i.test(peek()||''))dir=next().toUpperCase();order.push([f.toLowerCase(),dir]);if(peek()===',')next();}
      break}
    if(/^and$/i.test(w)){next();continue}
    if(/^or$/i.test(w)){next();groups.push([]);continue}
    let fld=next();let fl=fld.toLowerCase();
    if(fl==='"epic'){fl='"epic link"';next()}
    const f=FIELDMAP[fl];if(!f)throw `Lauks "${fld.replace(/"/g,'')}" neeksistē vai jums nav tiesību to redzēt.`;
    let op=next();if(!op)throw 'Trūkst operatora pēc lauka '+fld;op=op.toLowerCase();
    if(op==='not'){op='not '+(next()||'').toLowerCase()}
    if(op==='is'){if(/^not$/i.test(peek()||'')){next();op='is not'}next();groups[groups.length-1].push({f,op,v:null});continue}
    let v;
    if(op==='in'||op==='not in'){const a=next();v=[];if(/\(\)$/.test(a||''))v=[a];else{if(a!=='(')throw 'Pēc IN gaidīta (';while(p<t.length&&peek()!==')'){const x=next();if(x!==',')v.push(x)}next()}
      if(v.length===1&&/^opensprints\(\)$/i.test(v[0]))v=['__open'];else v=v.map(x=>jqlVal(f,x))}
    else{const raw=next();if(raw==null)throw 'Trūkst vērtības laukam '+fld;v=jqlVal(f,raw)}
    if(f==='sprint'&&Array.isArray(v)&&v[0]==='__open')v=Object.values(S.sprints).filter(s=>s.state==='active').map(s=>s.id);
    else if(f==='sprint'&&!Array.isArray(v)){const sp=Object.values(S.sprints).find(s=>s.name.toLowerCase()===String(v).toLowerCase()||s.id===v);v=sp?sp.id:v}
    groups[groups.length-1].push({f,op,v});
  }
  return {groups,order};
}
function match(i,c){
  const x=fieldVal(i,c.f);const lc=a=>String(a==null?'':a).toLowerCase();
  if(c.op==='is')return x==null||x===''||(Array.isArray(x)&&!x.length)||(c.f==='resolution'&&x==='Unresolved');
  if(c.op==='is not')return !(x==null||x===''||(Array.isArray(x)&&!x.length)||(c.f==='resolution'&&x==='Unresolved'));
  if(Array.isArray(x)){const has=v=>x.map(lc).includes(lc(v));
    if(c.op==='='||c.op==='~')return has(c.v);if(c.op==='!=')return !has(c.v);if(c.op==='in')return c.v.some(has);if(c.op==='not in')return !c.v.some(has);return false}
  switch(c.op){
    case '=':return lc(x)===lc(c.v);case '!=':return lc(x)!==lc(c.v);
    case '~':return lc(x).includes(lc(c.v));case '!~':return !lc(x).includes(lc(c.v));
    case 'in':return c.v.map(lc).includes(lc(x));case 'not in':return !c.v.map(lc).includes(lc(x));
    case '<':return x!=null&&x!==''&&x<c.v;case '<=':return x!=null&&x!==''&&x<=c.v;
    case '>':return x!=null&&x!==''&&x>c.v;case '>=':return x!=null&&x!==''&&x>=c.v;
  }
  throw 'Nezināms operators '+c.op;
}
const PRANK={Highest:5,High:4,Medium:3,Low:2,Lowest:1};
function runJQL(q){
  const {groups,order}=parseJQL(q||'');
  let r=S.issues.filter(i=>groups.some(g=>g.every(c=>match(i,c))));
  const ord=order||[['created','DESC']];
  r.sort((a,b)=>{for(const [f,d] of ord){let fa,fb;
      if(f==='priority'){fa=PRANK[a.priority];fb=PRANK[b.priority]}else if(f==='rank'||f==='key'){fa=+a.key.split('-')[1]+(projOf(a)==='PASK'?1000:0);fb=+b.key.split('-')[1]+(projOf(b)==='PASK'?1000:0)}
      else{const ff=FIELDMAP[f]||f;fa=fieldVal(a,ff)||'';fb=fieldVal(b,ff)||''}
      if(fa<fb)return d==='ASC'?-1:1;if(fa>fb)return d==='ASC'?1:-1}return 0});
  return r;
}

/* ---------- Maršruti ---------- */
function route(){
  const h=location.hash.replace(/^#\/?/,'')||'dash/d1';
  const [path,qs]=h.split('?');const parts=path.split('/');const q=new URLSearchParams(qs||'');
  return {parts,q};
}
function render(){
  renderNav();
  const {parts,q}=route();const a=$('#app');const p0=parts[0];
  let html='';
  try{
    if(p0==='dash')html=pDash(parts[1]||'d1');
    else if(p0==='dashboards')html=pDashList();
    else if(p0==='projects')html=pProjects();
    else if(p0==='board')html=shell(parts[1],'board',pBoard(parts[1]));
    else if(p0==='backlog')html=shell(parts[1],'backlog',pBacklog(parts[1]));
    else if(p0==='reports')html=shell(parts[1],'reports',pReports(parts[1]));
    else if(p0==='issue')html=pIssue(parts[1]);
    else if(p0==='search')html=pSearch(q);
    else if(p0==='filters')html=pFilters();
    else if(p0==='plans')html=pPlans();
    else if(p0==='plan')html=pPlan(parts[1]);
    else if(p0==='program')html=pProgram(parts[1]);
    else html='<div class="page"><div class="empty">Lapa nav atrasta.</div></div>';
  }catch(e){console.error(e);html='<div class="page"><div class="empty">Kļūda: '+esc(e.message||e)+'</div></div>'}
  a.innerHTML=html;
  renderDrawer();renderModal();
  if(p0==='plan')drawDeps();
}

/* ---------- Dashboards ---------- */
function gadgetBody(g){
  const f=filterById(g.filter);
  const list=(arr,empty)=>arr.length?`<table class="t"><tr><th>T</th><th>Key</th><th>Summary</th><th>Status</th><th>Due</th></tr>${arr.slice(0,8).map(i=>`<tr><td>${ti(i.type)}</td><td><a href="#/issue/${i.key}">${i.key}</a></td><td>${esc(i.summary)}</td><td>${lz(i.status)}</td><td class="${isOver(i)?'overdue':''}">${fmt(i.due)}</td></tr>`).join('')}</table><p class="help">Rāda 1–${Math.min(8,arr.length)} no ${arr.length}</p>`:`<p class="muted">${empty}</p>`;
  switch(g.type){
    case 'intro':return `<p><b>Laipni lūgti Jira mācību vidē.</b></p><p class="muted">Šis ir System Dashboard. Izveidojiet savu dashboard izvēlnē <b>Dashboards → Create dashboard</b> un pievienojiet gadžetus.</p>`;
    case 'assigned':return list(runJQL('assignee = currentUser() AND resolution = Unresolved ORDER BY priority DESC'),'Jums nav piešķirtu atvērtu uzdevumu.');
    case 'filter':return f?list(runJQL(f.jql),'Filtram nav rezultātu.'):'<p class="muted">Izvēlieties filtru gadžeta iestatījumos.</p>';
    case 'activity':return S.activity.length?S.activity.slice(0,8).map(a=>`<div class="cmt">${av(a.who,1)}<div class="b"><div class="who"><b>${esc(uname(a.who))}</b> ${esc(a.text)} <a href="#/issue/${a.key}">${a.key}</a></div><div class="help">${esc(a.when)}</div></div></div>`).join(''):'<p class="muted">Vēl nav aktivitātes. Veiciet izmaiņas kādā uzdevumā, un tās parādīsies šeit.</p>';
    case 'pie':{if(!f)return '<p class="muted">Izvēlieties filtru.</p>';const r=runJQL(f.jql);const by={};r.forEach(i=>{const k=g.stat==='assignee'?uname(i.assignee):g.stat==='priority'?i.priority:i.status;by[k]=(by[k]||0)+1});
      const SC={'To Do':'#8590A2','In Progress':'#0C66E4','In Review':'#E2B203','Done':'#1F845A'};const ent=Object.entries(by);const cols=g.stat==='status'?ent.map(([k])=>SC[k]):['#0C66E4','#E2B203','#1F845A','#8C1D2F','#5E4DB2','#8590A2'];let acc=0;const tot=r.length||1;
      const arcs=ent.map(([k,v],n)=>{const a0=acc/tot*2*Math.PI,a1=(acc+v)/tot*2*Math.PI;acc+=v;const L=a1-a0>Math.PI?1:0;
        const p=ent.length===1?`<circle cx="60" cy="60" r="56" fill="${cols[n%cols.length]}"/>`:`<path d="M60 60 L${60+56*Math.sin(a0)} ${60-56*Math.cos(a0)} A56 56 0 ${L} 1 ${60+56*Math.sin(a1)} ${60-56*Math.cos(a1)}Z" fill="${cols[n%cols.length]}" stroke="#fff" stroke-width="2"/>`;return p}).join('');
      return `<div class="row" style="gap:20px;align-items:center"><svg width="120" height="120" viewBox="0 0 120 120" role="img" aria-label="Sektoru diagramma">${arcs}</svg><div class="legend">${ent.map(([k,v],n)=>`<span><i style="background:${cols[n%cols.length]}"></i>${esc(k)}: <b>${v}</b> (${Math.round(v/tot*100)}%)</span>`).join('')}</div></div><p class="help">Filtrs: ${esc(f.name)} · Statistika: ${g.stat==='assignee'?'Assignee':g.stat==='priority'?'Priority':'Status'}</p>`}
    case 'twod':{if(!f)return '<p class="muted">Izvēlieties filtru.</p>';const r=runJQL(f.jql);const us=[...new Set(r.map(i=>i.assignee))];
      return `<table class="t"><tr><th>Assignee</th>${STATUSES.map(s=>`<th>${s}</th>`).join('')}<th>T:</th></tr>${us.map(u=>`<tr><td>${av(u,1)} ${esc(uname(u))}</td>${STATUSES.map(s=>`<td>${r.filter(i=>i.assignee===u&&i.status===s).length||''}</td>`).join('')}<td><b>${r.filter(i=>i.assignee===u).length}</b></td></tr>`).join('')}</table><p class="help">Two Dimensional Filter Statistics · ${esc(f.name)}</p>`}
    case 'sprint':{const sp=Object.values(S.sprints).find(s=>s.state==='active');if(!sp)return '<p class="muted">Nav aktīva sprinta.</p>';const r=S.issues.filter(i=>i.sprint===sp.id&&i.type!=='Sub-task');
      const done=r.filter(i=>i.status==='Done').length,ip=r.filter(i=>CAT[i.status]==='ip').length,td=r.length-done-ip;const left=diff(TODAY,sp.end);const pct=Math.round(diff(sp.start,TODAY)/diff(sp.start,sp.end)*100);
      return `<p><b>${esc(sp.name)}</b> · ${fmt(sp.start)}–${fmt(sp.end)}</p><p style="font:800 32px/1 var(--fd);margin:8px 0">${left} <span style="font-size:14px;font-weight:600" class="muted">dienas atlikušas</span></p>
        <div class="pbar" style="height:12px;margin:10px 0"><i style="width:${done/r.length*100}%;background:#1F845A"></i><i style="width:${ip/r.length*100}%;background:#0C66E4"></i><i style="width:${td/r.length*100}%;background:#DFE1E6"></i></div>
        <p class="help">Done ${done} · In progress ${ip} · To do ${td} · Pagājis ${pct}% sprinta laika</p>`}
  }
  return '';
}

function shell(pk,cur,body){
  const p=PROJECTS[pk];if(!p)return '<div class="page"><div class="empty">Projekts nav atrasts.</div></div>';
  const L=(k,href,l)=>`<a href="${href}" aria-current="${cur===k?'page':'false'}">${l}</a>`;
  return `<div class="shell"><nav class="side" aria-label="Projekta navigācija"><div class="pj"><span class="pico" style="background:${p.color}">${p.key.slice(0,2)}</span><div><b>${esc(p.name)}</b><small>Software project · ${p.kind}</small></div></div>
    ${p.kind==='Scrum'?L('backlog','#/backlog/'+pk,'☰ Backlog')+L('board','#/board/'+pk,'▦ Active sprints'):L('board','#/board/'+pk,'▦ Kanban board')}
    ${L('reports','#/reports/'+pk,'📈 Reports')}${L('issues','#/search?jql='+encodeURIComponent('project = '+pk+' ORDER BY created DESC'),'≡ Issues')}
    <a data-act="wf">⟳ Workflow</a></nav><div style="flex:1;min-width:0">${body}</div></div>`;
}
function boardIssues(pk){
  const p=PROJECTS[pk];let r=S.issues.filter(i=>projOf(i)===pk&&i.type!=='Epic');
  if(p.kind==='Scrum'){const sp=Object.values(S.sprints).find(s=>s.state==='active');r=r.filter(i=>sp&&i.sprint===sp.id)}
  else r=r.filter(i=>!(i.status==='Done'&&i.updated<addD(TODAY,-14)));
  const qf=UI.qf;
  if(qf.mine)r=r.filter(i=>i.assignee===me());
  if(qf.recent)r=r.filter(i=>i.updated>=addD(TODAY,-1));
  if(qf.over)r=r.filter(isOver);
  if(qf.user)r=r.filter(i=>i.assignee===qf.user);
  return r;
}
function bcard(i){
  const sub=kids(i.key).filter(k=>k.type==='Sub-task');const ep=i.epic&&get(i.epic);

   <div>${esc(i.summary)}</div>${ep?`<div><span class="tag" style="background:#F3F0FF;color:#5E4DB2">${esc(ep.epicName||ep.summary)}</span></div>`:''}

function basicFromJql(q){
  const o={};let t=q.replace(/\s+ORDER BY.*$/i,'').trim();if(!t)return o;
  t.split(/\s+AND\s+/i).forEach(c=>{let m;
    if((m=c.match(/^project\s*=\s*"?(\w+)"?$/i)))o.project=m[1].toUpperCase();
    else if((m=c.match(/^(issue)?type\s*=\s*"?([\w-]+)"?$/i)))o.type=m[2];
    else if((m=c.match(/^status\s*=\s*"([^"]+)"$/i))||(m=c.match(/^status\s*=\s*(\w+)$/i)))o.status=STATUSES.find(s=>s.toLowerCase()===m[1].toLowerCase());
    else if((m=c.match(/^assignee\s*=\s*(currentUser\(\)|\w+)$/i)))o.assignee=m[1];
    else if(/^duedate\s*<\s*now\(\)$/i.test(c))o.due='over';
    else if(/^duedate\s*<=\s*endOfWeek\(\)$/i.test(c))o.due='week';
    else if(/^duedate\s+is\s+EMPTY$/i.test(c))o.due='none';
    else if((m=c.match(/^text\s*~\s*"([^"]*)"$/i)))o.text=m[1];
    else o.unknown=true});
  return o;
}
function jqlFromBasic(o){
  const c=[];if(o.project)c.push('project = '+o.project);if(o.type)c.push('type = '+(o.type.includes('-')?`"${o.type}"`:o.type));if(o.status)c.push(`status = "${o.status}"`);
  if(o.assignee)c.push('assignee = '+o.assignee);if(o.due==='over')c.push('duedate < now()');if(o.due==='week')c.push('duedate <= endOfWeek()');if(o.due==='none')c.push('duedate is EMPTY');
  if(o.text)c.push(`text ~ "${o.text.replace(/"/g,'')}"`);
  return (c.join(' AND ')+' ORDER BY created DESC').trim();
}

function planIssues(pl){
  let set=[];
  pl.sources.forEach(s=>{
    if(s.t==='Project'||s.t==='Board')set.push(...S.issues.filter(i=>projOf(i)===s.v));
    if(s.t==='Filter'){const f=filterById(s.v);if(f){try{set.push(...runJQL(f.jql))}catch(e){}}}
  });
  set=[...new Set(set)].filter(i=>!(i.status==='Done'&&i.updated<addD(TODAY,-pl.excl)));
  return set;
}

      if(ts&&ps&&ts<ps)W.push({t:'Child issue starts before parent',k:i.key});

    if(te&&te<TODAY&&st!=='Done')W.push({t:'Open issue has passed its assigned end date',k:i.key});
  });

function allDeps(pl){

function planRows(pl){
  const iss=planIssues(pl);const rows=[];const done=new Set();
  const pushTree=(i,lvl)=>{if(done.has(i.key))return;done.add(i.key);rows.push({i,lvl});if(UI.collapsed[i.key])return;
    iss.filter(c=>(c.epic===i.key&&c.type!=='Sub-task')||c.parent===i.key).forEach(c=>pushTree(c,lvl+1))};
  iss.filter(i=>i.type==='Epic').forEach(e=>pushTree(e,0));

  return rows;
}

function doTrans(k,to,via){
  const i=get(k);const from=i.status;if(from===to)return;
  setField(i,'status',to,'Status',via);act(k,`mainīja statusu ${from} → ${to}`);
  notify([i.reporter,i.assignee,...i.watchers],`[JIRA] ${uname(me())} mainīja ${k}`,`${i.summary}: ${from} → ${to}`);
  save();flag(`<b>${k}</b> pārvietots uz <b>${to}</b>`);
}
function createIssue(){
  const m=UI.modal;const g=id=>{const e=$('#'+id);return e?e.value.trim():''};
  const v={project:m.parent?projOf(get(m.parent)):g('c_project'),type:m.parent?'Sub-task':g('c_type'),summary:g('c_summary'),epicName:g('c_epicname'),desc:g('c_desc'),assignee:g('c_assignee'),priority:g('c_priority')||'Medium',due:g('c_due'),labels:g('c_labels'),epic:g('c_epic'),sprint:g('c_sprint')};
  const err={};if(!v.summary)err.summary='Summary ir obligāts lauks.';if(v.type==='Epic'&&!v.epicName)err.epicName='Epic Name ir obligāts lauks.';
  if(Object.keys(err).length){UI.modal=Object.assign({},m,{v,err});renderModal();return}
  const pk=v.project;S.seq[pk]++;const key=pk+'-'+S.seq[pk];const file=$('#c_file')&&$('#c_file').files[0];
  const par=m.parent&&get(m.parent);
  const i={key,type:v.type,summary:v.summary,epicName:v.type==='Epic'?v.epicName:undefined,desc:v.desc,assignee:v.assignee||null,reporter:me(),priority:v.priority,due:v.due||null,
    labels:v.labels?v.labels.split(',').map(s=>s.trim()).filter(Boolean):[],epic:par?null:(v.epic||null),parent:par?par.key:null,sprint:par?par.sprint:(v.sprint||null),status:'To Do',ts:null,te:v.due||null,sp:null,
    created:TODAY,updated:TODAY,comments:[],atts:file?[{name:file.name,size:Math.max(1,Math.round(file.size/1024))+' KB',who:me(),when:TODAY}]:[],hist:[{who:me(),when:now(),field:'Created',from:'',to:''}],links:[],watchers:[me()],est:null,rem:null,wl:[]};
  if(i.te)i.ts=addD(i.te,-5)<TODAY?TODAY:addD(i.te,-5);
  S.issues.push(i);act(key,'izveidoja');
  if(i.assignee)notify([i.assignee],`[JIRA] ${uname(me())} piešķīra jums ${key}`,i.summary);
  save();
  const another=$('#c_another')&&$('#c_another').checked;
  if(another){UI.modal={t:'create',v:{project:pk,type:v.type},another:true};renderModal()}else closeModal();
  flag(`Uzdevums <a href="#/issue/${key}"><b>${key}</b></a> izveidots.`);
  render();

function addComment(k){
  const ta=$('#cta');let body=ta.value.trim();if(!body){ta.focus();return}
  const i=get(k);
  // @Vārds → @[lietotājs]
  Object.keys(USERS).forEach(u=>{const n=USERS[u].name;body=body.replace(new RegExp('@'+n.replace(/ /g,'\\s')+'|@'+n.split(' ')[0]+'(?![\\wāčēģīķļņšūž])','g'),'@['+u+']')});
  const men=[...body.matchAll(/@\[(\w+)\]/g)].map(x=>x[1]);
  i.comments.push({who:me(),when:now(),body});i.updated=TODAY;act(k,'komentēja');
  men.forEach(u=>notify([u],`[JIRA] ${uname(me())} pieminēja jūs ${k}`,body.replace(/@\[(\w+)\]/g,(a,b)=>'@'+uname(b))));
  notify([i.reporter,i.assignee,...i.watchers].filter(u=>!men.includes(u)),`[JIRA] ${uname(me())} komentēja ${k}`,i.summary);
  save();render();flag(men.length?`Komentārs pievienots. Pieminētie (${men.map(uname).join(', ')}) saņems e-pastu.`:'Komentārs pievienots.');
}

document.addEventListener('pointermove',ev=>{if(!bd)return;const dd=Math.round((ev.clientX-bd.x)/PX);bd.dd=dd;
  if(bd.edge==='r')bd.el.style.width=Math.max(PX,bd.w+dd*PX)+'px';else if(bd.edge==='l'){bd.el.style.left=bd.left+dd*PX+'px';bd.el.style.width=Math.max(PX,bd.w-dd*PX)+'px'}else bd.el.style.left=bd.left+dd*PX+'px';
  bd.el.title=`${fmt(bd.edge==='r'?bd.ts:addD(bd.ts,dd))}–${fmt(bd.edge==='l'?bd.te:addD(bd.te,dd))}`});
document.addEventListener('pointerup',()=>{if(!bd)return;const {pl,k,dd,edge,ts,te}=bd;bd=null;if(!dd){location.hash='#/issue/'+k;return}
  let nts=ts,nte=te;if(edge!=='r')nts=addD(ts,dd);if(edge!=='l')nte=addD(te,dd);if(nts>nte){if(edge==='l')nts=nte;else nte=nts}
  setDraft(pl,k,'ts',nts);setDraft(pl,k,'te',nte);save();render();flag(`${k}: ${fmt(nts)}–${fmt(nte)} (nesaglabāts, skatiet Review changes)`,1)});
window.addEventListener('hashchange',()=>{UI.more=null;UI.menu=null;UI.wOpen=false;UI.editDesc=false;UI.tab='all';render();window.scrollTo(0,0)});
window.addEventListener('resize',()=>{if(route().parts[0]==='plan')drawDeps()});
document.addEventListener('scroll',ev=>{},true);
render();
</script>
