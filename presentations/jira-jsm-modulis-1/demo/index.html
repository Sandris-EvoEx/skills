<!doctype html>
<html lang="lv">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Jira mācību vide</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:ital,wght@0,400;0,500;0,600;0,700;1,400&family=IBM+Plex+Mono:wght@400;500&family=Manrope:wght@700;800&display=swap">
<style>
/* Layout: mācību smilškaste. Augšā demo josla (lomu pārslēgs, paziņojumi, scenārijs), zem tās
   vai nu klientu portāls (Saeimas klareta galvene), vai Jira aģenta skats (zilā navigācija + projekta sānjosla).
   Apzināti viena gaiša tēma, jo tā atdarina Jira DC noklusējuma izskatu. */
:root{
  color-scheme:light;
  --bg:#F4F5F7; --surface:#FFFFFF; --ink:#172B4D; --muted:#5E6C84; --line:#DFE1E6; --line2:#EBECF0;
  --blue:#0C66E4; --blue-d:#0747A6; --blue-soft:#E9F2FF;
  --green:#216E4E; --green-soft:#DCFFF1; --amber:#7F5F01; --amber-soft:#FFF7D6; --amber-line:#E2B203;
  --red:#AE2E24; --red-soft:#FFECEB; --purple:#5E4DB2; --purple-soft:#F3F0FF;
  --claret:#8C1D2F; --claret-d:#6B1524; --demo:#1A1D24;
  --f:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --fm:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
  --fd:"Manrope","IBM Plex Sans",system-ui,sans-serif;
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.45 var(--f)}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--blue);outline-offset:2px}
a{color:var(--blue);text-decoration:none;cursor:pointer}
a:hover{text-decoration:underline}
.mono{font-family:var(--fm)}
.muted{color:var(--muted)}
.hidden{display:none!important}

/* Demo bar */
#demobar{position:sticky;top:0;z-index:50;background:var(--demo);color:#E9EAEE;display:flex;align-items:center;gap:12px;flex-wrap:wrap;padding:8px 16px;padding-top:calc(8px + env(safe-area-inset-top,0px))}
#demobar .badge{font:800 11px/1 var(--fd);letter-spacing:.14em;text-transform:uppercase;background:#E8788A;color:#1A1D24;padding:5px 8px;border-radius:4px}
#demobar .ttl{font-weight:600;white-space:nowrap}
#demobar .sp{flex:1}
.seg{display:inline-flex;background:#2C303A;border-radius:8px;padding:3px}
.seg button{border:0;background:transparent;color:#C9CCD4;padding:6px 12px;border-radius:6px;font-weight:600;font-size:13px;min-height:32px}
.seg button[aria-pressed="true"]{background:#F4F5F7;color:#1A1D24}
.dbtn{border:1px solid #444A57;background:#232730;color:#E9EAEE;border-radius:6px;padding:6px 12px;font-size:13px;font-weight:600;min-height:32px;display:inline-flex;align-items:center;gap:6px}
.dbtn:hover{border-color:#8A90A0}
.dbtn .cnt{background:#E8788A;color:#1A1D24;border-radius:999px;padding:0 6px;font-size:11px;font-weight:700}

/* Layout shells */
#main{display:flex;min-height:calc(100% - 52px)}
#app{flex:1;min-width:0}
#drawer{width:360px;flex:none;background:var(--surface);border-left:1px solid var(--line);overflow-y:auto;max-height:calc(100vh - 52px);position:sticky;top:52px}
@media (max-width:900px){#drawer{position:fixed;inset:52px 0 0 auto;width:min(360px,92vw);z-index:40;box-shadow:-8px 0 24px rgb(9 30 66 / .18)}}

/* Buttons and inputs (Jira-like) */
.btn{border:0;border-radius:3px;padding:6px 12px;font-weight:500;background:#091E420F;color:var(--ink);min-height:32px;display:inline-flex;align-items:center;gap:6px}
.btn:hover{background:#091E4224}
.btn.primary{background:var(--blue);color:#fff}
.btn.primary:hover{background:var(--blue-d)}
.btn.subtle{background:transparent}
.btn.subtle:hover{background:#091E420F}
.btn.green{background:#1F845A;color:#fff}
.btn.sm{padding:3px 8px;min-height:26px;font-size:13px}
input[type=text],input[type=search],input[type=date],select,textarea{border:2px solid var(--line);background:#FAFBFC;border-radius:3px;padding:6px 8px;width:100%;min-height:36px}
input:focus,select:focus,textarea:focus{border-color:var(--blue);background:#fff;outline:none}
textarea{min-height:96px;resize:vertical}
label.f{display:block;font-weight:600;font-size:12px;color:var(--muted);margin:0 0 4px}
label.f .req{color:var(--red)}
.field{display:flex;flex-direction:column;gap:2px}
.err{color:var(--red);font-size:12px;display:flex;gap:4px;align-items:center}
.field.has-err input,.field.has-err select,.field.has-err textarea{border-color:var(--red);background:var(--red-soft)}
.help{font-size:12px;color:var(--muted)}

/* Lozenges */
.lz{display:inline-block;font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.02em;padding:2px 6px;border-radius:3px;background:#DFE1E6;color:#42526E;white-space:nowrap}
.lz.Izpildē,.lz.Ārpakalpojumā{background:var(--blue-soft);color:#0055CC}
.lz.Atlikts{background:var(--green-soft);color:var(--green)}
.lz.Slēgts{background:#1F845A;color:#fff}
.sla{font-family:var(--fm);font-size:12px;white-space:nowrap}
.sla.bad{color:var(--red);font-weight:600}
.sla.ok{color:var(--green)}
.sla.pause{color:var(--muted)}

/* ===== PORTAL ===== */
.p-head{background:linear-gradient(120deg,var(--claret-d),var(--claret) 55%,#A23345);color:#fff}
.p-top{display:flex;align-items:center;gap:10px 16px;flex-wrap:wrap;padding:12px 24px;max-width:1100px;margin:0 auto}
@media (max-width:600px){.p-top,.p-hero,.p-body{padding-left:16px;padding-right:16px}.p-top .sp{flex-basis:100%;height:0}}
.p-brand{font:800 15px/1 var(--fd);letter-spacing:.2em}
.p-top .sp{flex:1}
.p-top .lnk{color:#fff;opacity:.92;font-weight:600;padding:6px 10px;border-radius:4px;background:rgb(255 255 255 / .12);border:0}
.p-top .lnk:hover{background:rgb(255 255 255 / .22)}
.p-top .who{font-size:13px;opacity:.9}
.p-hero{max-width:1100px;margin:0 auto;padding:28px 24px 40px;display:flex;flex-direction:column;gap:14px}
.p-hero h1{font:800 30px/1.15 var(--fd);margin:0;text-wrap:balance}
.p-search{position:relative;max-width:640px}
.p-search input{border:0;border-radius:6px;min-height:46px;padding:10px 14px;font-size:16px;background:#fff;box-shadow:0 2px 8px rgb(0 0 0 / .18)}
.p-results{position:absolute;left:0;right:0;top:52px;background:#fff;color:var(--ink);border-radius:6px;box-shadow:0 8px 24px rgb(9 30 66 / .25);z-index:5;overflow:hidden}
.p-results button{display:flex;flex-direction:column;align-items:flex-start;gap:2px;width:100%;text-align:left;border:0;background:#fff;padding:10px 14px;border-bottom:1px solid var(--line2)}
.p-results button:hover{background:var(--blue-soft)}
.p-body{max-width:1100px;margin:0 auto;padding:24px}
.crumb{font-size:13px;color:var(--muted);display:flex;gap:6px;flex-wrap:wrap;margin-bottom:10px}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:16px}
.pcard{background:#fff;border:1px solid var(--line);border-radius:8px;padding:18px;display:flex;gap:14px;align-items:flex-start;text-align:left;cursor:pointer;box-shadow:0 1px 1px rgb(9 30 66 / .12)}
.pcard:hover{box-shadow:0 4px 12px rgb(9 30 66 / .16);border-color:#C1C7D0}
.pcard h3{margin:0 0 4px;font-size:16px;color:var(--blue)}
.pcard p{margin:0;font-size:13px;color:var(--muted)}
.ico{width:36px;height:36px;border-radius:8px;display:grid;place-items:center;flex:none}
.ico svg{width:22px;height:22px}
.panel{background:#fff;border:1px solid var(--line);border-radius:8px;padding:20px}
.rt-list{display:flex;flex-direction:column}
.rt-item{display:flex;gap:14px;align-items:flex-start;padding:14px 8px;border-bottom:1px solid var(--line2);background:transparent;border-left:0;border-right:0;border-top:0;text-align:left;width:100%}
.rt-item:hover{background:#FAFBFC}
.rt-item b{color:var(--blue);font-size:15px}
.rt-item span{display:block;color:var(--muted);font-size:13px}
.form{display:flex;flex-direction:column;gap:16px;max-width:620px}
.notice{display:flex;gap:10px;align-items:flex-start;padding:12px 14px;border-radius:6px;font-size:13px;line-height:1.5}
.notice.info{background:var(--blue-soft)}
.notice.warn{background:var(--amber-soft);border-left:4px solid var(--amber-line)}
.notice.ok{background:var(--green-soft)}
.notice.int{background:var(--amber-soft)}
.filelist{display:flex;gap:6px;flex-wrap:wrap}
.file{display:inline-flex;gap:6px;align-items:center;font-size:12px;background:#F4F5F7;border:1px solid var(--line);border-radius:4px;padding:3px 8px}
.p-req{display:grid;grid-template-columns:minmax(0,1fr) 280px;gap:20px}
@media (max-width:820px){.p-req{grid-template-columns:1fr}}
.act{display:flex;flex-direction:column;gap:12px}
.cmt{display:flex;gap:10px}
.av{width:32px;height:32px;border-radius:50%;display:grid;place-items:center;font-weight:700;font-size:12px;color:#fff;flex:none}
.cmt .bd{flex:1;min-width:0}
.cmt .meta{font-size:12px;color:var(--muted)}
.cmt .tx{white-space:pre-wrap;word-wrap:break-word;margin-top:2px}
.cmt.internal .bubble{background:var(--amber-soft);border:1px solid #F5CD47;border-radius:6px;padding:8px 10px}
.cmt.public .bubble{background:#fff;border:1px solid var(--line);border-radius:6px;padding:8px 10px}
.side-box{display:flex;flex-direction:column;gap:10px;font-size:13px}
.side-box dt{color:var(--muted);font-size:12px;font-weight:600}
.side-box dd{margin:0 0 6px}
.tbl-wrap{overflow-x:auto;background:#fff;border:1px solid var(--line);border-radius:6px}
table.t{border-collapse:collapse;width:100%;font-size:13px}
table.t th{text-align:left;font-size:12px;color:var(--muted);font-weight:600;padding:8px 10px;border-bottom:2px solid var(--line);white-space:nowrap;background:#FAFBFC}
table.t td{padding:8px 10px;border-bottom:1px solid var(--line2);vertical-align:middle}
table.t tr.row{cursor:pointer}
table.t tr.row:hover td{background:#F4F5F7}
table.t .key{font-family:var(--fm);font-size:12px;color:var(--blue);white-space:nowrap}
.tabs{display:flex;gap:4px;flex-wrap:wrap;margin-bottom:12px}
.tabs button{border:0;background:transparent;padding:6px 10px;border-radius:3px;font-weight:600;color:var(--muted)}
.tabs button[aria-pressed="true"]{background:var(--blue-soft);color:var(--blue)}
.stars{display:flex;gap:4px}
.stars button{border:1px solid var(--line);background:#fff;border-radius:4px;width:36px;height:36px;font-weight:700}
.stars button.on{background:#FFF7D6;border-color:var(--amber-line)}

/* ===== AGENT ===== */
.j-nav{background:var(--blue-d);color:#fff;display:flex;align-items:center;gap:4px;padding:6px 12px;flex-wrap:wrap}
.j-nav .logo{font:800 14px/1 var(--fd);letter-spacing:.06em;padding:6px 10px;display:flex;gap:6px;align-items:center}
.j-nav .logo small{font:600 10px/1 var(--f);background:rgb(255 255 255 / .2);padding:3px 5px;border-radius:3px;letter-spacing:.06em}
.j-nav .n{border:0;background:transparent;color:#fff;padding:7px 10px;border-radius:3px;font-weight:500}
.j-nav .n:hover,.j-nav .n.on{background:rgb(255 255 255 / .16)}
.j-nav .create{background:#fff;color:var(--blue-d);font-weight:600;border:0;border-radius:3px;padding:6px 12px;margin-left:6px}
.j-nav .sp{flex:1}
.j-nav input{width:220px;min-height:32px;border:0;border-radius:3px;background:rgb(255 255 255 / .18);color:#fff;padding:5px 10px}
.j-nav input::placeholder{color:#DCE6F7}
.j-nav input:focus{background:#fff;color:var(--ink)}
.j-shell{display:flex;min-height:calc(100vh - 100px)}
.j-side{width:236px;flex:none;background:#FAFBFC;border-right:1px solid var(--line);padding:14px 10px;display:flex;flex-direction:column;gap:2px}
.j-side .proj{display:flex;gap:10px;align-items:center;padding:6px 8px 14px}
.j-side .proj b{display:block;font-size:13px;line-height:1.25}
.j-side .proj span{font-size:12px;color:var(--muted)}
.j-side .h{font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);padding:12px 8px 4px}
.j-side button{display:flex;justify-content:space-between;align-items:center;border:0;background:transparent;text-align:left;padding:6px 8px;border-radius:3px;color:var(--ink);font-size:13px;width:100%}
.j-side button:hover{background:#091E420F}
.j-side button.on{background:var(--blue-soft);color:var(--blue);font-weight:600}
.j-side .c{font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}
.j-side .projsel{margin:0 0 6px}
.j-main{flex:1;min-width:0;padding:20px 24px 40px;display:flex;flex-direction:column;gap:14px}
.j-main h1{font:600 22px/1.25 var(--f);margin:0}
@media (max-width:760px){.j-shell{flex-direction:column}.j-side{width:auto;flex-direction:row;flex-wrap:wrap;border-right:0;border-bottom:1px solid var(--line)}.j-side .proj,.j-side .h{display:none}.j-side button{width:auto}.j-nav input{width:140px}}
.issue{display:grid;grid-template-columns:minmax(0,1fr) 300px;gap:24px}
@media (max-width:1000px){.issue{grid-template-columns:1fr}}
.ops{display:flex;gap:6px;flex-wrap:wrap}
.trans{background:var(--blue-soft);color:#0055CC;font-weight:600}
.trans:hover{background:#CCE0FF}
.desc{background:#fff;border:1px solid var(--line);border-radius:4px;padding:12px;white-space:pre-wrap}
.ctabs{display:flex;border-bottom:2px solid var(--line);gap:4px}
.ctabs button{border:0;background:transparent;padding:8px 12px;font-weight:600;color:var(--muted);border-bottom:3px solid transparent;margin-bottom:-2px}
.ctabs button.ext[aria-pressed="true"]{color:var(--blue);border-color:var(--blue)}
.ctabs button.int[aria-pressed="true"]{color:var(--amber);border-color:var(--amber-line)}
.cedit{position:relative}
.cedit textarea.int{background:var(--amber-soft);border-color:#F5CD47}
.mention{position:absolute;left:8px;bottom:-4px;transform:translateY(100%);background:#fff;border:1px solid var(--line);border-radius:4px;box-shadow:0 8px 16px rgb(9 30 66 / .2);z-index:6;min-width:220px}
.mention button{display:flex;gap:8px;align-items:center;width:100%;border:0;background:#fff;padding:8px 10px;text-align:left}
.mention button:hover,.mention button.on{background:var(--blue-soft)}
.side-card{background:#fff;border:1px solid var(--line);border-radius:4px;padding:12px 14px;display:flex;flex-direction:column;gap:8px}
.side-card h4{margin:0;font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.05em}
.kv{display:grid;grid-template-columns:110px minmax(0,1fr);gap:6px 10px;font-size:13px;align-items:center}
.kv .k{color:var(--muted)}
.chip{display:inline-flex;gap:4px;align-items:center;background:#F4F5F7;border-radius:12px;padding:2px 8px;font-size:12px;margin:2px 4px 2px 0}
.chip button{border:0;background:transparent;padding:0 2px;color:var(--muted)}
.hist{font-size:12px;color:var(--muted);display:flex;flex-direction:column;gap:6px}
.hist b{color:var(--ink);font-weight:600}
.dlg{background:#fff;border:1px solid var(--line);border-radius:6px;box-shadow:0 8px 24px rgb(9 30 66 / .2);padding:16px;display:flex;flex-direction:column;gap:12px}
.filters{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:10px;background:#fff;border:1px solid var(--line);border-radius:6px;padding:12px}
.jql{font-family:var(--fm);font-size:13px;background:#F4F5F7;border:1px solid var(--line);border-radius:4px;padding:10px 12px;white-space:pre-wrap;word-break:break-word}
.presets{display:flex;gap:6px;flex-wrap:wrap}
.dash{display:grid;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));gap:14px}
.gad{background:#fff;border:1px solid var(--line);border-radius:4px;display:flex;flex-direction:column;min-width:0}
.gad .gh{display:flex;justify-content:space-between;align-items:center;padding:8px 12px;border-bottom:1px solid var(--line);font-weight:600;font-size:13px}
.gad .gb{padding:10px 12px;overflow-x:auto}
.bars{display:flex;flex-direction:column;gap:8px;font-size:12px}
.bars .r{display:grid;grid-template-columns:110px 1fr 28px;gap:8px;align-items:center}
.bars i{display:block;height:12px;border-radius:2px;background:var(--blue)}
.bars .n{text-align:right;font-variant-numeric:tabular-nums}
.empty{background:#fff;border:1px dashed #C1C7D0;border-radius:8px;padding:28px;text-align:center;display:flex;flex-direction:column;gap:10px;align-items:center}

/* Toast, mail */
#toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:#172B4D;color:#fff;padding:10px 16px;border-radius:6px;box-shadow:0 8px 24px rgb(9 30 66 / .3);font-size:13px;z-index:60;max-width:min(560px,92vw)}
.mail{border-bottom:1px solid var(--line2);padding:10px 0;font-size:13px}
.mail .to{font-weight:600}
.mail .sub{color:var(--muted);font-size:12px}
.mail.none{color:var(--muted);font-style:italic}

/* Guide drawer */
.g{padding:16px 18px 40px;display:flex;flex-direction:column;gap:14px}
.g h2{font:800 16px/1.2 var(--fd);margin:0}
.g h3{font-size:13px;margin:8px 0 0;display:flex;justify-content:space-between;gap:8px;align-items:baseline}
.g h3 span{font-weight:500;color:var(--muted);font-size:12px;white-space:nowrap}
.g ol{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:6px}
.g li label{display:flex;gap:8px;align-items:flex-start;font-size:13px;line-height:1.4;cursor:pointer}
.g li input{margin-top:3px;flex:none}
.g li.done label{color:var(--muted);text-decoration:line-through}
.g .say{font-size:12px;background:var(--purple-soft);border-radius:4px;padding:6px 8px;color:#352C63}
kbd{font-family:var(--fm);font-size:11px;background:#fff;border:1px solid var(--line);border-bottom-width:2px;border-radius:3px;padding:0 5px}
.modal-bg{position:fixed;inset:0;background:rgb(9 30 66 / .54);z-index:70;display:grid;place-items:center;padding:16px}
.modal{background:#fff;border-radius:6px;max-width:520px;width:100%;padding:20px;display:flex;flex-direction:column;gap:12px;max-height:85vh;overflow-y:auto}
.modal h2{margin:0;font-size:18px}
.sc{display:grid;grid-template-columns:90px 1fr;gap:6px 12px;font-size:13px}
@media (prefers-reduced-motion:no-preference){.fade{animation:fd .18s ease-out}@keyframes fd{from{opacity:.4;transform:translateY(3px)}to{opacity:1;transform:none}}}
</style>
</head>
<body>
<div id="demobar">
  <span class="badge">Mācību demo</span>
  <span class="ttl">Jira Service Management · nav īstā sistēma</span>
  <div class="seg" role="group" aria-label="Skats">
    <button id="sw-portal" data-act="side" data-v="portal">Klients · portāls</button>
    <button id="sw-agent" data-act="side" data-v="agent">Aģents · Jira</button>
  </div>
  <span class="sp"></span>
  <button class="dbtn" id="b-mail" data-act="mail">Paziņojumi <span class="cnt" id="mailcnt">0</span></button>
  <button class="dbtn" id="b-guide" data-act="guide" aria-pressed="true">Scenārijs</button>
  <button class="dbtn" data-act="reset">Atiestatīt datus</button>
</div>
<div id="main">
  <div id="app"></div>
  <aside id="drawer" aria-label="Demo scenārijs"></aside>
</div>
<div id="toast" class="hidden" role="status" aria-live="polite"></div>
<div id="modal"></div>

<script>
(function(){
"use strict";
var KEY='jsm-demo-v2', GKEY='jsm-demo-guide-v1';
var MIN=60000, HOUR=60*MIN, DAY=24*HOUR;

/* ---------- reference data ---------- */
var AGENTS=[
  {id:'es',name:'Jūs (aģents)',ini:'JA',col:'#0C66E4'},
  {id:'mliepa',name:'Māris Liepa',ini:'ML',col:'#5E4DB2'},
  {id:'jozols',name:'Jānis Ozols',ini:'JO',col:'#216E4E'},
  {id:'ikalna',name:'Inga Kalna',ini:'IK',col:'#A54800'}
];
var CUSTOMERS=[
  {id:'aberzina',name:'Anna Bērziņa',ini:'AB',col:'#8C1D2F',unit:'Juridiskais birojs'},
  {id:'ljansone',name:'Laura Jansone',ini:'LJ',col:'#6B4000',unit:'Komisiju birojs'},
  {id:'ekrumins',name:'Edgars Krūmiņš',ini:'EK',col:'#2E5C45',unit:'Kanceleja'}
];

function notify(i,what,internal,mentioned){
  var to=[];
  if(!internal){if(i.notify&&!isAgent(i.reporter))to.push(i.reporter);i.participants.forEach(function(p){to.push(p)})}
  if(i.assignee&&i.assignee!=='es')to.push(i.assignee);
  i.watchers.forEach(function(w){if(w!=='es')to.push(w)});
  (mentioned||[]).forEach(function(m){to.push(m)});
  var uniq=[];to.forEach(function(x){if(uniq.indexOf(x)<0&&x!==curUser())uniq.push(x)});
  S.mail.unshift({at:now(),key:i.key,what:what,internal:internal,to:uniq});
  if(S.mail.length>60)S.mail.length=60;
  return uniq;
}
function curUser(){return S.side==='portal'?S.me:'es'}
function nextKey(p){var n=S.counters[p]++;return p+'-'+n}
function createIssue(o){
  var r=o.rt?rt(o.rt):null,t=now();
  var i={key:nextKey(o.p),p:o.p,rt:o.rt||null,it:r?r.it:(o.it||'Task'),summary:o.summary,desc:o.desc||'',fields:o.fields||{},reporter:o.reporter,assignee:null,status:'Reģistrēts',resolution:null,
    created:t,updated:t,resolvedAt:null,comments:[],history:[{at:t,who:o.by||o.reporter,f:'Izveidots',from:'',to:r?r.name:'(bez Request type)'}],participants:[],watchers:[],attachments:o.attachments||[],
    firstResp:null,frTarget:t+HOUR,resTarget:t+(r?r.sla:3*DAY),pausedMs:0,pausedAt:null,notify:true,rating:null};
  S.issues.unshift(i);
  if(r&&!isAgent(i.reporter))S.mail.unshift({at:t,key:i.key,what:'Pieteikums reģistrēts: '+i.summary,internal:false,to:[i.reporter]});
  return i;
}
function addComment(i,who,text,internal,att){
  var ment=[];text.replace(/@([A-ZĀČĒĢĪĶĻŅŠŪŽ][\wāčēģīķļņšūž]+ [A-ZĀČĒĢĪĶĻŅŠŪŽ][\wāčēģīķļņšūž]+)/g,function(m,n){AGENTS.forEach(function(a){if(a.name===n&&ment.indexOf(a.id)<0)ment.push(a.id)})});
  i.comments.push({who:who,internal:!!internal,text:text,at:now(),att:att||[]});
  (att||[]).forEach(function(a){i.attachments.push(a)});
  if(isAgent(who)&&!internal)i.firstResp=true;
  ment.forEach(function(m){if(i.watchers.indexOf(m)<0)i.watchers.push(m)});
  touch(i);
  var to=notify(i,(internal?'Iekšējs komentārs':'Jauns komentārs')+' · '+i.summary,internal,ment);
  return to;
}

function qList(q,pid){
  return S.issues.filter(function(i){return i.p===pid&&i.rt!==undefined}).filter(function(i){
    if(q==='open')return !resolved(i);
    if(q==='mine')return !resolved(i)&&i.assignee==='es';
    if(q==='unassigned')return !resolved(i)&&!i.assignee;
    if(q==='onhold')return i.status==='Atlikts'||i.status==='Ārpakalpojumā';
    if(q==='breached')return !resolved(i)&&breached(i);
    if(q==='resolved')return resolved(i)&&i.resolvedAt>now()-7*DAY;
    return true;
  }).sort(function(a,b){if(q==='resolved')return b.resolvedAt-a.resolvedAt;var x=slaRes(a).left,y=slaRes(b).left;return (x==null?1e15:x)-(y==null?1e15:y)});
}

/* search */
function applySearch(F){
  return S.issues.filter(function(i){
    if(F.proj&&i.p!==F.proj)return false;
    if(F.status==='unres'&&resolved(i))return false;
    if(F.status&&F.status!=='unres'&&i.status!==F.status)return false;
    if(F.assignee==='me'&&i.assignee!=='es')return false;
    if(F.assignee==='none'&&i.assignee)return false;
    if(F.assignee&&['me','none'].indexOf(F.assignee)<0&&i.assignee!==F.assignee)return false;
    if(F.rt&&i.rt!==F.rt)return false;
    if(F.stale&&i.updated>now()-7*DAY)return false;
    if(F.breached&&!breached(i))return false;
    if(F.month){var d=new Date();d.setDate(1);d.setHours(0,0,0,0);if(i.created<d.getTime())return false}
    if(F.text&&(i.key+' '+i.summary+' '+i.desc).toLowerCase().indexOf(F.text.toLowerCase())<0)return false;
    return true;
  }).sort(function(a,b){return b.updated-a.updated});
}
function jqlOf(F){
  var c=[];
  if(F.proj)c.push('project = '+F.proj);
  if(F.rt)c.push('"Customer Request Type" = "'+rt(F.rt).name+'"');
  if(F.status==='unres')c.push('resolution = Unresolved');else if(F.status)c.push('status = "'+F.status+'"');
  if(F.assignee==='me')c.push('assignee = currentUser()');else if(F.assignee==='none')c.push('assignee is EMPTY');else if(F.assignee)c.push('assignee = "'+person(F.assignee).name+'"');
  if(F.stale)c.push('updated <= -7d');
  if(F.breached)c.push('"Time to resolution" = breached()');
  if(F.month)c.push('created >= startOfMonth()');
  if(F.text)c.push('text ~ "'+F.text.replace(/"/g,'')+'"');
  return (c.join(' AND ')||'')+' ORDER BY updated DESC';
}

function cvrSVG(list){
  var days=14,W=460,H=150,pl=28,pb=22,pt=10;
  var t0=new Date();t0.setHours(0,0,0,0);var start=t0.getTime()-(days-1)*DAY;
  var c=[],r=[];for(var k=0;k<days;k++){var a=start+k*DAY,b=a+DAY;c.push(list.filter(function(i){return i.created>=a&&i.created<b}).length);r.push(list.filter(function(i){return i.resolvedAt&&i.resolvedAt>=a&&i.resolvedAt<b}).length)}
  var cc=[],rc=[],sc=0,sr=0;c.forEach(function(v,k){sc+=v;sr+=r[k];cc.push(sc);rc.push(sr)});
  var mx=Math.max.apply(null,cc.concat(rc).concat([1]));
  function pts(a){return a.map(function(v,k){return (pl+k*(W-pl-8)/(days-1)).toFixed(1)+','+(pt+(H-pt-pb)*(1-v/mx)).toFixed(1)}).join(' ')}
  var y0=H-pb;
  return '<svg viewBox="0 0 '+W+' '+H+'" width="100%" role="img" aria-label="Kumulatīvi izveidoti '+sc+', slēgti '+sr+' pēdējās '+days+' dienās"><g stroke="#EBECF0"><line x1="'+pl+'" y1="'+pt+'" x2="'+(W-8)+'" y2="'+pt+'"/><line x1="'+pl+'" y1="'+((pt+y0)/2)+'" x2="'+(W-8)+'" y2="'+((pt+y0)/2)+'"/><line x1="'+pl+'" y1="'+y0+'" x2="'+(W-8)+'" y2="'+y0+'"/></g><g font-size="10" fill="#5E6C84" font-family="IBM Plex Sans, sans-serif"><text x="'+(pl-6)+'" y="'+(pt+4)+'" text-anchor="end">'+mx+'</text><text x="'+(pl-6)+'" y="'+(y0+3)+'" text-anchor="end">0</text><text x="'+pl+'" y="'+(H-6)+'">pirms '+(days-1)+' d</text><text x="'+(W-8)+'" y="'+(H-6)+'" text-anchor="end">šodien</text></g><polyline fill="none" stroke="#AE2E24" stroke-width="2.5" points="'+pts(cc)+'"/><polyline fill="none" stroke="#216E4E" stroke-width="2.5" points="'+pts(rc)+'"/></svg><div style="display:flex;gap:14px;font-size:12px"><span style="color:#AE2E24">● Izveidoti (kumulatīvi) '+sc+'</span><span style="color:#216E4E">● Slēgti '+sr+'</span></div>';
}
function rReports(pid){
  var list=S.issues.filter(function(i){return i.p===pid});
  var by={};list.filter(function(i){return !resolved(i)}).forEach(function(i){var k=i.assignee?person(i.assignee).name:'Unassigned';by[k]=(by[k]||0)+1});
  var ks=Object.keys(by).sort(function(a,b){return by[b]-by[a]}),mx=Math.max.apply(null,ks.map(function(x){return by[x]}).concat([1]));
  var res=list.filter(resolved),met=res.filter(function(i){return slaRes(i).met}).length,pct=res.length?Math.round(met/res.length*100):0;

  h+='<section class="gad"><div class="gh">Workload <span class="muted" style="font-weight:400">atvērtie pēc aģenta</span></div><div class="gb"><div class="bars">'+ks.map(function(x){return '<div class="r"><span>'+esc(x)+'</span><i style="width:'+Math.round(by[x]/mx*100)+'%;'+(x==='Unassigned'?'background:var(--red)':'')+'"></i><span class="n">'+by[x]+'</span></div>'}).join('')+'</div></div></section>';
  h+='<section class="gad"><div class="gh">SLA goals · Time to resolution</div><div class="gb"><div style="font:800 40px/1 var(--fd);color:'+(pct>=90?'var(--green)':'var(--amber)')+'">'+pct+'%</div><div class="muted" style="font-size:13px;margin-top:6px">'+met+' no '+res.length+' atrisinātajiem iekļāvās termiņā'+(pct>=90?' · mērķis 90 % sasniegts':' · zem 90 % mērķa')+'</div></div></section>';

}

    case 'openfilter':{var fl=S.filters.filter(function(f){return f.id===t.dataset.id})[0];S.search=JSON.parse(JSON.stringify(fl.f));A.filterName=fl.name;render();break;}
    case 'favfilter':{var ff=S.filters.filter(function(f){return f.id===t.dataset.id})[0];ff.fav=!ff.fav;render();break;}
    case 'subfilter':{var sf=S.filters.filter(function(f){return f.id===t.dataset.id})[0];toast('Abonements izveidots: “'+sf.name+'” katru darba dienu 8:30 uz jūsu e-pastu (demo)');break;}
    case 'export':{var rows=applySearch(S.search);toast('Eksportēti '+rows.length+' pieteikumi uz CSV (demo: fails netiek lejupielādēts)');break;}
    case 'mkdash':A.mkdash=true;render();$('#d-name').select();break;
    case 'cancelmkdash':A.mkdash=false;render();break;
    case 'domkdash':S.dash={name:$('#d-name').value.trim()||'Mans dashboard',share:$('#d-share').value,cols:2,gadgets:[]};A.mkdash=false;A.adding=true;render();break;
    case 'deldash':S.dash=null;render();break;
    case 'addgad':A.adding=true;render();break;
    case 'canceladd':A.adding=false;render();break;
    case 'doaddgad':S.dash.gadgets.push({type:$('#g-type').value,f:$('#g-f').value});A.adding=false;render();break;
    case 'rmgad':S.dash.gadgets.splice(+t.dataset.k,1);render();break;
    case 'mvgad':{var k=+t.dataset.k,d=+t.dataset.d,G=S.dash.gadgets,tmp=G[k];G[k]=G[k+d];G[k+d]=tmp;render();break;}
    case 'layout':S.dash.cols=S.dash.cols===1?2:S.dash.cols===2?3:1;render();break;
  }
});
document.addEventListener('change',function(e){
  var t=e.target,A=S.agent,i;
  if(t.dataset.act==='gstep'){var g=gload();g[t.dataset.id]=t.checked;gsave(g);t.closest('li').classList.toggle('done',t.checked);return}
  if(t.id==='me-sel'){S.me=t.value;if(S.portal.page==='request'||S.portal.page==='created')S.portal={page:'requests'};render();toast('Tagad jūs esat '+person(S.me).name);return}
  if(t.id==='p-projsel'){var r1=RTS.filter(function(x){return x.p===t.value})[0];S.portal={page:'form',id:r1.id};render();return}
  if(t.id==='p-rtsel'){S.portal={page:'form',id:t.value,val:keepVals('p')};render();return}
  if(t.id==='a-projsel'){var r3=RTS.filter(function(x){return x.p===t.value})[0];S.agent={page:'raise',rt:r3.id,proj:t.value};render();return}
  if(t.id==='a-rtsel'){S.agent.rt=t.value;S.agent.val=keepVals('a');S.agent.err={};render();return}
  if(t.id==='a-proj'){S.agent={page:'queue',q:'open',proj:t.value};render();return}
  if(t.id==='a-asg'){i=iss(A.id);assign(i,t.value||null);return}
  if(t.id==='a-rt'){i=iss(A.id);var from=rt(i.rt).name;i.rt=t.value;i.it=rt(t.value).it;hist(i,'es','Request type',from,rt(t.value).name);render();toast('Request type nomainīts');return}
  if(t.id==='c-p'){S.agent.c={p:t.value,s:$('#c-s').value};render();return}
  if(t.dataset.act==='sfilter'||t.id==='s-stale'||t.id==='s-br'){readSearch();render();return}
});
document.addEventListener('input',function(e){
  var t=e.target;
  if(t.id==='p-q'){var q=t.value.trim().toLowerCase(),box=$('#p-res');if(!q){box.classList.add('hidden');return}
    var m=RTS.filter(function(r){return (r.name+' '+r.desc).toLowerCase().indexOf(q)>=0||(q.length>3&&r.name.toLowerCase().indexOf(q.slice(0,-1))>=0)});
    box.innerHTML=m.length?m.map(function(r){return '<button data-act="p" data-page="form" data-id="'+r.id+'"><b style="color:var(--blue)">'+esc(r.name)+'</b><span class="muted" style="font-size:12px">'+esc(proj(r.p).name)+'</span></button>'}).join(''):'<div style="padding:12px 14px" class="muted">Nekas neatbilst. Mēģiniet citu vārdu.</div>';box.classList.remove('hidden');return}
  if(t.id==='p-rq'){S.portal.q=t.value;render(true);return}
  if(t.id==='s-text'){readSearch();clearTimeout(t._d);t._d=setTimeout(function(){render(true)},250);return}
  if(t.id==='a-cm'){var v=t.value.slice(0,t.selectionStart),mm=/@([\wāčēģīķļņšūžĀČĒĢĪĶĻŅŠŪŽ]*)$/.exec(v),box2=$('#ment');
    if(!mm){box2.classList.add('hidden');return}
    var cand=AGENTS.slice(1).filter(function(a){return a.name.toLowerCase().indexOf(mm[1].toLowerCase())===0||a.name.split(' ')[1].toLowerCase().indexOf(mm[1].toLowerCase())===0});
    if(!cand.length){box2.classList.add('hidden');return}
    box2.innerHTML=cand.map(function(a){return '<button data-act="ment" data-name="'+esc(a.name)+'">'+av(a.id,24)+esc(a.name)+'</button>'}).join('');box2.classList.remove('hidden');return}
});
function keepVals(pref){var v={};['behalf','summary','desc'].forEach(function(k){var el=$('#'+pref+'-'+k);if(el)v[k]=el.value});return v}
function readSearch(){var F=S.search;F.proj=$('#s-proj').value;F.status=$('#s-status').value;F.assignee=$('#s-asg').value;F.rt=$('#s-rt').value;F.text=$('#s-text').value.trim();F.stale=$('#s-stale').checked;F.breached=$('#s-br').checked;F.month=false;S.agent.filterName=null}
function assign(i,who){var from=i.assignee?person(i.assignee).name:'Unassigned';if(i.assignee===who)return;i.assignee=who;hist(i,'es','Assignee',from,who?person(who).name:'Unassigned');if(who&&who!=='es')S.mail.unshift({at:now(),key:i.key,what:'Jums piešķirts pieteikums: '+i.summary,internal:true,to:[who]});render();toast(who?'Piešķirts: '+person(who).name:'Piešķīrums noņemts')}
function shortcutModal(){modal('<h2>Īsinājumtaustiņi</h2><div class="sc"><span><kbd>/</kbd></span><span>Meklēšana augšējā joslā</span><span><kbd>i</kbd></span><span>Piešķirt sev (pieteikumā)</span><span><kbd>a</kbd></span><span>Piešķirt citam (pieteikumā)</span><span><kbd>m</kbd></span><span>Komentēt (pieteikumā)</span><span><kbd>c</kbd></span><span>Create</span><span><kbd>g</kbd> <kbd>d</kbd></span><span>Uz Dashboard</span><span><kbd>g</kbd> <kbd>i</kbd></span><span>Uz meklēšanu (Issues)</span><span><kbd>?</kbd></span><span>Šis saraksts</span></div><p class="muted" style="font-size:12px;margin:0">Īstajā Jira sarakstu atverat ar <kbd>?</kbd>. Taustiņi nestrādā, kamēr kursors ir teksta laukā.</p><div style="display:flex;justify-content:flex-end"><button class="btn primary" data-act="closemodal">Aizvērt</button></div>')}
var gPending=0;
document.addEventListener('keydown',function(e){
  var t=e.target;
  if(t.id==='j-q'&&e.key==='Enter'){var q=t.value.trim();if(!q)return;var k=iss(q.toUpperCase());if(k)goA({page:'issue',id:k.key,proj:k.p});else{S.search={proj:'',status:'',assignee:'',rt:'',text:q,stale:false,breached:false};goA({page:'search'})}return}
  if(e.key==='Escape'){if($('#modal').innerHTML){modal('');return}var mb=$('#ment');if(mb)mb.classList.add('hidden');return}
  if(t.closest&&t.closest('input,textarea,select')||e.ctrlKey||e.metaKey||e.altKey)return;
  if(S.side!=='agent')return;
  var key=e.key;
  if(gPending&&Date.now()-gPending<1200){gPending=0;if(key==='d'){goA({page:'dashboard'});return}if(key==='i'){goA({page:'search'});return}}
  if(key==='g'){gPending=Date.now();return}
  if(key==='/'){e.preventDefault();$('#j-q').focus();return}
  if(key==='?'){shortcutModal();return}
  if(key==='c'){goA({page:'create'});return}
  if(S.agent.page==='issue'){var i=iss(S.agent.id);if(key==='i'){assign(i,'es');return}if(key==='a'){var s=$('#a-asg');s.focus();return}if(key==='m'){e.preventDefault();var c=$('#a-cm');c.focus();c.scrollIntoView({block:'center'});return}}
});
document.addEventListener('click',function(e){var r=$('#p-res');if(r&&!e.target.closest('.p-search'))r.classList.add('hidden')},true);
// SLA timers tick
setInterval(function(){var a=document.activeElement;if(a&&(a.tagName==='TEXTAREA'||a.tagName==='INPUT'||a.tagName==='SELECT'))return;if(S.side==='agent'&&['queue','issue','search'].indexOf(S.agent.page)>=0)render()},60000);

render();renderGuide();
if(window.innerWidth<900){$('#b-guide').setAttribute('aria-pressed','false');renderGuide()}
})();
</script>
</body>
</html>
